<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Social Audit Console (B2B)</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: horizontal module tab-strip at top (scrolls on phone), single scrolling content column below */
:root{
  color-scheme: light;
  --bg:#f9f9f7; --surface:#fcfcfb; --surface-2:#f2f1ed;
  --ink:#0b0b0b; --ink-2:#52514e; --muted:#898781;
  --border:rgba(11,11,11,0.10);
  --accent:#2a78d6; --accent-ink:#ffffff;
  --good:#0ca30c; --warning:#fab219; --critical:#d03b3b;
  --series-1:#2a78d6; --series-2:#eb6834; --series-3:#1baf7a; --series-4:#eda100; --series-5:#e87ba4;
  --grid:#e1e0d9; --axis:#c3c2b7;
  --seq-1:#cde2fb; --seq-2:#9ec5f4; --seq-3:#6da7ec; --seq-4:#3987e5; --seq-5:#256abf; --seq-6:#184f95; --seq-7:#0d366b;
  --seq-1-ink:#0b0b0b; --seq-2-ink:#0b0b0b; --seq-3-ink:#0b0b0b; --seq-4-ink:#ffffff; --seq-5-ink:#ffffff; --seq-6-ink:#ffffff; --seq-7-ink:#ffffff;
  --font-display:'Space Grotesk',system-ui,-apple-system,sans-serif;
  --font-body:'Inter',system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#0d0d0d; --surface:#1a1a19; --surface-2:#232321;
    --ink:#f0efec; --ink-2:#c3c2b7; --muted:#898781;
    --border:rgba(255,255,255,0.10);
    --accent:#3987e5; --accent-ink:#ffffff;
    --good:#0ca30c; --warning:#fab219; --critical:#d03b3b;
    --series-1:#3987e5; --series-2:#d95926; --series-3:#199e70; --series-4:#c98500; --series-5:#d55181;
    --grid:#2c2c2a; --axis:#383835;
    --seq-1:#0d366b; --seq-2:#184f95; --seq-3:#256abf; --seq-4:#3987e5; --seq-5:#6da7ec; --seq-6:#9ec5f4; --seq-7:#cde2fb;
    --seq-1-ink:#ffffff; --seq-2-ink:#ffffff; --seq-3-ink:#ffffff; --seq-4-ink:#ffffff; --seq-5-ink:#0b0b0b; --seq-6-ink:#0b0b0b; --seq-7-ink:#0b0b0b;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#0d0d0d; --surface:#1a1a19; --surface-2:#232321;
  --ink:#f0efec; --ink-2:#c3c2b7; --muted:#898781;
  --border:rgba(255,255,255,0.10);
  --accent:#3987e5; --accent-ink:#ffffff;
  --good:#0ca30c; --warning:#fab219; --critical:#d03b3b;
  --series-1:#3987e5; --series-2:#d95926; --series-3:#199e70; --series-4:#c98500; --series-5:#d55181;
  --grid:#2c2c2a; --axis:#383835;
  --seq-1:#0d366b; --seq-2:#184f95; --seq-3:#256abf; --seq-4:#3987e5; --seq-5:#6da7ec; --seq-6:#9ec5f4; --seq-7:#cde2fb;
  --seq-1-ink:#ffffff; --seq-2-ink:#ffffff; --seq-3-ink:#ffffff; --seq-4-ink:#ffffff; --seq-5-ink:#0b0b0b; --seq-6-ink:#0b0b0b; --seq-7-ink:#0b0b0b;
}
*{box-sizing:border-box;}
body{
  background:var(--bg); color:var(--ink);
  font-family:var(--font-body); font-size:14px; line-height:1.5;
  padding-left:max(16px, env(safe-area-inset-left,0px));
  padding-right:max(16px, env(safe-area-inset-right,0px));
}
h1,h2,h3{font-family:var(--font-display); font-weight:600; text-wrap:balance; margin:0;}
.tnum{font-variant-numeric:tabular-nums;}
a{color:var(--accent);}
.topbar{display:flex; align-items:baseline; justify-content:space-between; gap:12px; flex-wrap:wrap; padding:20px 0 12px; border-bottom:1px solid var(--border); margin-bottom:0;}
.topbar h1{font-size:20px;}
.topbar .sub{color:var(--muted); font-size:12px;}
nav.tabs{display:flex; gap:4px; overflow-x:auto; padding:10px 0; border-bottom:1px solid var(--border); margin-bottom:20px; scrollbar-width:thin;}
nav.tabs a{flex:0 0 auto; padding:7px 13px; border-radius:7px; color:var(--ink-2); text-decoration:none; font-size:13px; font-weight:500; white-space:nowrap; border:1px solid transparent;}
nav.tabs a.active{background:var(--accent); color:var(--accent-ink);}
nav.tabs a:not(.active):hover{background:var(--surface-2); border-color:var(--border);}
main{padding-bottom:48px; min-width:0;}
.panel{display:flex; flex-direction:column; gap:20px;}
.card{background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:18px 20px; min-width:0;}
.card h2{font-size:15px; margin-bottom:4px;}
.card .hint{color:var(--muted); font-size:12.5px; margin-bottom:14px;}
.row{display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end;}
.field{display:flex; flex-direction:column; gap:4px; min-width:0;}
.field label{font-size:11.5px; color:var(--muted); text-transform:uppercase; letter-spacing:.04em;}
input,select,textarea,button{font-family:var(--font-body); font-size:13.5px; color:var(--ink); background:var(--surface-2); border:1px solid var(--border); border-radius:7px; padding:8px 10px;}
textarea{min-height:64px; resize:vertical; font-family:inherit;}
input,select{height:36px;}
input[type="checkbox"]{width:auto; height:auto; accent-color:var(--accent);}
button{cursor:pointer; font-weight:600; border-color:var(--border);}
button.primary{background:var(--accent); color:var(--accent-ink); border-color:transparent;}
button.primary:disabled{opacity:.55; cursor:default;}
button.ghost{background:transparent;}
button.danger{color:var(--critical); border-color:var(--critical);}
button:hover:not(:disabled){filter:brightness(1.05);}
table{width:100%; border-collapse:collapse; font-size:13px;}
table th{text-align:left; color:var(--muted); font-weight:500; font-size:11px; text-transform:uppercase; letter-spacing:.04em; padding:6px 8px; border-bottom:1px solid var(--border);}
table td{padding:8px 8px; border-bottom:1px solid var(--border); vertical-align:top;}
.tablewrap{overflow-x:auto;}
.chip{display:inline-flex; align-items:center; gap:5px; padding:2px 9px; border-radius:100px; font-size:11.5px; font-weight:600; background:var(--surface-2); border:1px solid var(--border);}
.dot{width:8px; height:8px; border-radius:50%; flex:0 0 auto;}
.muted{color:var(--muted);}
.empty{color:var(--muted); font-size:13px; padding:20px 0; text-align:center;}
.hr{height:1px; background:var(--border); margin:4px 0;}
.badge{font-size:11px; padding:2px 7px; border-radius:5px; font-weight:600;}
.badge.good{background:var(--good); color:#fff;}
.badge.warning{background:var(--warning); color:#0b0b0b;}
.badge.critical{background:var(--critical); color:#fff;}
.analysis-out{white-space:pre-wrap; font-size:13.5px; line-height:1.6;}
.legend{display:flex; gap:14px; flex-wrap:wrap; font-size:12px; color:var(--ink-2); margin-top:8px;}
.legend span{display:inline-flex; align-items:center; gap:6px;}
#chartTip{position:fixed; pointer-events:none; background:var(--ink); color:var(--bg); font-size:12px; padding:5px 9px; border-radius:6px; z-index:50; display:none; font-variant-numeric:tabular-nums; max-width:220px;}
[data-theme="dark"] #chartTip, :root:not([data-theme="light"]) #chartTip{}
.imgrow{display:flex; gap:10px; flex-wrap:wrap;}
.imgcard{width:110px;}
.imgcard img{width:100%; height:80px; object-fit:cover; border-radius:6px; border:1px solid var(--border);}
.imgcard .capt{font-size:11px; color:var(--muted); margin-top:3px;}
.stat{display:flex; flex-direction:column; gap:2px;}
.stat .n{font-size:22px; font-weight:600; font-family:var(--font-display);}
.stat .l{font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.04em;}
.grid-stats{display:grid; grid-template-columns:repeat(auto-fit,minmax(110px,1fr)); gap:14px;}
code.inline{background:var(--surface-2); padding:1px 5px; border-radius:4px; font-size:12px;}
.toolbar{display:flex; gap:8px; align-items:center; flex-wrap:wrap;}
.dropzone{border:2px dashed var(--border); border-radius:10px; padding:14px; cursor:pointer; min-height:64px; display:flex; flex-direction:column; gap:8px; align-items:flex-start; transition:border-color .15s,background .15s;}
.dropzone.drag-over{border-color:var(--accent); background:var(--surface-2);}
.dropzone-hint{color:var(--muted); font-size:12.5px;}
.dropzone-thumbs{display:flex; flex-wrap:wrap; gap:8px;}
.shot-thumb{position:relative; width:64px; height:64px;}
.shot-thumb img{width:100%; height:100%; object-fit:cover; border-radius:6px; border:1px solid var(--border);}
.shot-remove{position:absolute; top:-6px; right:-6px; width:18px; height:18px; border-radius:50%; background:var(--critical); color:#fff; border:none; font-size:11px; line-height:1; padding:0; cursor:pointer; display:flex; align-items:center; justify-content:center;}
@media (max-width:640px){
  .row{flex-direction:column; align-items:stretch;}
  .field{width:100%;}
}
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap">

<div class="topbar">
  <div>
    <h1>Social Audit Console</h1>
    <div class="sub">Competitive social media audit — engagement, owned terms, sentiment, paid ads, visual style</div>
  </div>
  <div class="sub" id="dbStatus">Loading…</div>
</div>

<nav class="tabs" id="tabs">
  <a href="#setup" data-tab="setup">Setup</a>
  <a href="#presence" data-tab="presence">Presence</a>
  <a href="#engagement" data-tab="engagement">Engagement</a>
  <a href="#terms" data-tab="terms">Terms</a>
  <a href="#sentiment" data-tab="sentiment">Sentiment</a>
  <a href="#ads" data-tab="ads">Paid Ads</a>
  <a href="#visual" data-tab="visual">Visual Style</a>
  <a href="#reviews" data-tab="reviews">Review Sites</a>
  <a href="#appstore" data-tab="appstore">App Store</a>
  <a href="#synthesis" data-tab="synthesis">Synthesis</a>
  <a href="#trends" data-tab="trends">Trends</a>
</nav>

<main id="main"></main>
<div id="chartTip"></div>

<script>
(function(){
"use strict";

/* ---------- constants ---------- */
var PLATFORMS = ["Instagram","Facebook","TikTok","X","LinkedIn","YouTube","Pinterest","Other"];
var ADS_PLATFORMS = ["Meta Ads","TikTok","X","LinkedIn","YouTube","Pinterest","Google Ads","Other"];
var STORES = ["App Store","Google Play"];
var REVIEW_SITES = ["G2","Capterra","TrustRadius","Software Advice","Gartner Peer Insights","Other"];
var MEDIA_TYPES = ["Photo","Carousel","Video","Reel/Short","Text","Story","Live"];
var SERIES_VARS = ["--series-1","--series-2","--series-3","--series-4","--series-5"];
/* Which metrics each platform actually shows publicly, and what it calls them.
   Field keys stay canonical (likes/comments/shares/views) so charts and analysis
   can sum across platforms; only the visible fields and their labels change. */
var PLATFORM_METRICS = {
  "Instagram": [["likes","Likes"],["comments","Comments"],["shares","Shares"],["views","Views"]],
  "Facebook":  [["likes","Reactions"],["comments","Comments"],["shares","Shares"],["views","Views"]],
  "TikTok":    [["likes","Likes"],["comments","Comments"],["shares","Shares"],["views","Views"]],
  "X":         [["likes","Likes"],["comments","Replies"],["shares","Reposts"],["views","Views"]],
  "LinkedIn":  [["likes","Reactions"],["comments","Comments"],["shares","Reposts"],["views","Impressions"]],
  "YouTube":   [["likes","Likes"],["comments","Comments"],["views","Views"]],
  "Pinterest": [["likes","Reactions"],["comments","Comments"],["shares","Saves"],["views","Views"]],
  "Other":     [["likes","Likes"],["comments","Comments"],["shares","Shares"],["views","Views"]]
};
function metricFieldsHtml(platform, vals){
  var defs = PLATFORM_METRICS[platform] || PLATFORM_METRICS.Other;
  return defs.map(function(d){
    var key = d[0], label = d[1];
    var v = vals && vals[key]!=null && vals[key]!=="" ? vals[key] : "";
    return '<div class="field"><label>'+esc(label)+'</label><input name="'+key+'" type="number" min="0" value="'+esc(v)+'"></div>';
  }).join("");
}

/* ---------- tiny helpers ---------- */
function qs(s,el){return (el||document).querySelector(s);}
function qsa(s,el){return Array.prototype.slice.call((el||document).querySelectorAll(s));}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function fmtNum(n){ n = Number(n)||0; if(Math.abs(n)>=1000000) return (n/1000000).toFixed(1)+"M"; if(Math.abs(n)>=1000) return (n/1000).toFixed(1)+"K"; return String(Math.round(n)); }
function fmtPct(n){ n = Number(n)||0; return (n*100).toFixed(n<0.001?3:2)+"%"; }
function fmtDate(s){ if(!s) return "—"; var d=new Date(s); if(isNaN(d)) return esc(s); return d.toLocaleDateString(undefined,{year:"numeric",month:"short",day:"numeric"}); }
function nowIso(){return new Date().toISOString();}
function uid(){return Math.random().toString(36).slice(2,10);}
function options(list, sel){ return list.map(function(o){return '<option value="'+esc(o)+'"'+(o===sel?' selected':'')+'>'+esc(o)+'</option>';}).join(""); }
function showTip(x,y,html){ var t=qs("#chartTip"); t.innerHTML=html; t.style.display="block"; t.style.left=Math.min(x+12, window.innerWidth-230)+"px"; t.style.top=(y+12)+"px"; }
function hideTip(){ qs("#chartTip").style.display="none"; }

/* ---------- state ---------- */
var state = {
  brands: [], presence: [], posts: [], comments: [], ads: [], appListings: [], appScreenshots: [], reviewListings: [], reviewScreenshots: [],
  analysis: {}, snapshots: [], ready: false
};
var caps = { db:null, user:null, assets:null, sample:null };
var runningCalls = {}; // key -> AbortController
var editing = { presence:null, post:null, ad:null, comment:null, appListing:null, reviewListing:null }; // id currently being edited, per module
var pendingPostScreenshots = null; // [{id,url}] staged for the post form; null = not yet initialized for this form session
var imageAnalysisErrors = {}; // analysis key (e.g. "visual_<brandId>", "appVisual_<brandId>") -> last sample() error code

/* colored brand order: target first (series-1), then competitors by createdAt */
function coloredBrands(){
  var target = state.brands.filter(function(b){return b.isTarget;});
  var rest = state.brands.filter(function(b){return !b.isTarget;}).slice().sort(function(a,b){return (a.createdAt||"").localeCompare(b.createdAt||"");});
  var ordered = target.concat(rest);
  return ordered.map(function(b,i){ return Object.assign({}, b, { colorVar: SERIES_VARS[i % SERIES_VARS.length] }); });
}
function brandColorVar(id){ var c = coloredBrands().filter(function(b){return b.id===id;})[0]; return c ? c.colorVar : "--muted"; }
function brandById(id){ return state.brands.filter(function(b){return b.id===id;})[0]; }
function brandName(id){ var b=brandById(id); return b ? b.name : "(deleted brand)"; }

/* ---------- boot ---------- */
async function boot(){
  if(!window.claude || !window.claude.use){ qs("#dbStatus").textContent="No Claude runtime — read-only"; renderRoute(); return; }
  caps.db = await window.claude.use("db").catch(function(){return null;});
  caps.user = await window.claude.use("user").catch(function(){return null;});
  caps.assets = await window.claude.use("assets").catch(function(){return null;});
  caps.sample = await window.claude.use("sample").catch(function(){return null;});

  if(!caps.db){ qs("#dbStatus").textContent="Storage unavailable in this view"; renderRoute(); return; }

  var timeoutFlag = {hit:false};
  var loadTimer = setTimeout(function(){ timeoutFlag.hit=true; qs("#dbStatus").textContent="Still connecting…"; }, 10000);

  function sub(colName, stateKey, idField){
    caps.db.collection(colName).onSnapshot(function(snap){
      clearTimeout(loadTimer);
      state[stateKey] = snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
      qs("#dbStatus").textContent = "Synced";
      state.ready = true;
      renderRoute();
    }, function(err){
      qs("#dbStatus").textContent = "Sync error: " + err.code;
    });
  }
  sub("brands","brands");
  sub("presence","presence");
  sub("posts","posts");
  sub("postComments","comments");
  sub("ads","ads");
  sub("reviewListings","reviewListings");
  sub("reviewScreenshots","reviewScreenshots");
  sub("appListings","appListings");
  sub("appScreenshots","appScreenshots");
  sub("snapshots","snapshots");
  caps.db.collection("analysis").onSnapshot(function(snap){
    var by = {};
    snap.docs.forEach(function(d){ by[d.id] = Object.assign({id:d.id}, d.data()); });
    state.analysis = by;
    renderRoute();
  }, function(){});

  renderRoute();
}

/* ---------- routing ---------- */
var ROUTES = ["setup","presence","engagement","terms","sentiment","ads","visual","reviews","appstore","synthesis","trends"];
function currentRoute(){
  var h = (location.hash||"").replace("#","");
  return ROUTES.indexOf(h) >= 0 ? h : "setup";
}
window.addEventListener("hashchange", renderRoute);

function renderRoute(){
  var route = currentRoute();
  qsa("#tabs a").forEach(function(a){ a.classList.toggle("active", a.getAttribute("data-tab")===route); });
  var main = qs("#main");
  if(!state.ready && caps.db){ main.innerHTML = '<div class="empty">Loading your audit…</div>'; return; }
  var fn = RENDERERS[route];
  main.innerHTML = fn ? fn() : "";
  wireRoute(route);
}

var RENDERERS = {
  setup: renderSetup, presence: renderPresence, engagement: renderEngagement,
  terms: renderTerms, sentiment: renderSentiment, ads: renderAds,
  visual: renderVisual, reviews: renderReviews, appstore: renderAppStore, synthesis: renderSynthesis, trends: renderTrends
};

/* =========================================================
   SETUP
   ========================================================= */
function renderSetup(){
  var cb = coloredBrands();
  var rows = cb.map(function(b){
    return '<tr>'+
      '<td><span class="dot" style="background:var('+b.colorVar+')"></span></td>'+
      '<td>'+esc(b.name)+ (b.isTarget ? ' <span class="chip">Target</span>' : '') +'</td>'+
      '<td class="muted">'+esc(b.notes||"")+'</td>'+
      '<td><button class="ghost" data-act="set-target" data-id="'+b.id+'">Make target</button> '+
      '<button class="danger ghost" data-act="del-brand" data-id="'+b.id+'">Remove</button></td>'+
    '</tr>';
  }).join("") || '<tr><td colspan="4" class="empty">No brands yet — add your target brand first, then 3–4 competitors.</td></tr>';

  return '<div class="panel">'+
    '<div class="card">'+
      '<h2>Brands in this audit</h2>'+
      '<div class="hint">Add the target brand first and mark it as Target, then add competitors. Target is always the first color in every chart.</div>'+
      '<div class="tablewrap"><table><thead><tr><th></th><th>Brand</th><th>Notes</th><th></th></tr></thead><tbody>'+rows+'</tbody></table></div>'+
    '</div>'+
    '<div class="card">'+
      '<h2>Add a brand</h2>'+
      '<form id="brandForm" class="row">'+
        '<div class="field"><label>Name</label><input required name="name" placeholder="e.g. Acme Co."></div>'+
        '<div class="field"><label>Notes</label><input name="notes" placeholder="optional"></div>'+
        '<div class="field"><label>Role</label><select name="isTarget"><option value="false">Competitor</option><option value="true">Target brand</option></select></div>'+
        '<button class="primary" type="submit">Add brand</button>'+
      '</form>'+
    '</div>'+
    '<div class="card">'+
      '<h2>How data gets in</h2>'+
      '<div class="hint" style="margin-bottom:0">'+
        'Every other tab works the same way: fill in a short form per post/comment/ad/screenshot you copy from the platform, or paste a JSON batch where noted. '+
        'YouTube can skip manual copying — ask Claude for the <b>YouTube pull helper script</b> (run locally with a free API key) and paste its output into the Engagement tab’s bulk-import box.'+
      '</div>'+
    '</div>'+
  '</div>';
}
function wireSetup(){
  var f = qs("#brandForm"); if(!f) return;
  f.addEventListener("submit", async function(e){
    e.preventDefault();
    if(!caps.db) return;
    var fd = new FormData(f);
    var isTarget = fd.get("isTarget")==="true";
    if(isTarget){
      await Promise.all(state.brands.filter(function(b){return b.isTarget;}).map(function(b){
        return caps.db.collection("brands").doc(b.id).update({isTarget:false});
      }));
    }
    await caps.db.collection("brands").add({
      name: fd.get("name"), notes: fd.get("notes")||"", isTarget: isTarget, createdAt: nowIso()
    });
    f.reset();
  });
}

/* =========================================================
   PRESENCE
   ========================================================= */
function renderPresence(){
  var cb = coloredBrands();
  if(cb.length===0) return '<div class="empty">Add brands in Setup first.</div>';
  var rows = "";
  cb.forEach(function(b){
    var entries = state.presence.filter(function(p){return p.brandId===b.id;});
    if(entries.length===0){
      rows += '<tr><td><span class="chip"><span class="dot" style="background:var('+b.colorVar+')"></span>'+esc(b.name)+'</span></td><td colspan="5" class="empty">No platforms scanned yet</td></tr>';
    } else {
      entries.forEach(function(p,i){
        rows += '<tr>'+
          (i===0 ? '<td rowspan="'+entries.length+'"><span class="chip"><span class="dot" style="background:var('+b.colorVar+')"></span>'+esc(b.name)+'</span></td>' : '')+
          '<td>'+esc(p.platform)+'</td>'+
          '<td class="tnum">'+fmtNum(p.followers)+'</td>'+
          '<td>'+fmtDate(p.lastPostDate)+'</td>'+
          '<td>'+esc(p.cadence||"—")+'</td>'+
          '<td class="muted">'+esc(p.bioNotes||"")+'</td>'+
          '<td><button class="ghost" data-act="edit-presence" data-id="'+p.id+'">Edit</button> <button class="danger ghost" data-act="del-presence" data-id="'+p.id+'">×</button></td>'+
        '</tr>';
      });
    }
  });
  var editRec = editing.presence ? state.presence.filter(function(p){return p.id===editing.presence;})[0] : null;
  return '<div class="panel">'+
    '<div class="card">'+

function buildGroupedBarChart(grouped, mediaTypes, cb){
  var W=680,H=300,padL=44,padR=16,padT=16,padB=36;
  var plotW = W-padL-padR, plotH = H-padT-padB;
  var maxVal = 0;
  mediaTypes.forEach(function(mt){ cb.forEach(function(b){ var g=grouped[mt][b.id]; if(g){ var v=g.sum/g.count; if(v>maxVal) maxVal=v; } }); });
  if(!maxVal) maxVal = 0.01;
  var groupW = plotW/mediaTypes.length;
  var barGap = 3, groupPad = 14;
  var barW = Math.max(6,(groupW-groupPad*2-barGap*(cb.length-1))/Math.max(1,cb.length));
  var svg = '';
  // gridlines
  var ticks=4;
  for(var t=0;t<=ticks;t++){
    var yy = padT + plotH - (plotH*t/ticks);
    svg += '<line x1="'+padL+'" y1="'+yy+'" x2="'+(W-padR)+'" y2="'+yy+'" stroke="var(--grid)" stroke-width="1"/>';
    svg += '<text x="'+(padL-8)+'" y="'+(yy+4)+'" text-anchor="end" font-size="10" fill="var(--muted)">'+fmtPct(maxVal*t/ticks)+'</text>';
  }
  mediaTypes.forEach(function(mt,gi){
    var gx = padL + gi*groupW;
    cb.forEach(function(b,bi){
      var g = grouped[mt][b.id];
      var v = g ? g.sum/g.count : 0;
      var h = (v/maxVal)*plotH;
      var x = gx + groupPad + bi*(barW+barGap);
      var y = padT + plotH - h;
      if(v>0){
        svg += '<path data-tip="'+esc(brandName(b.id))+' · '+esc(mt)+': '+fmtPct(v)+' avg engagement rate" d="'+roundedTopRectPath(x,y,barW,h,3)+'" fill="var('+b.colorVar+')"></path>';
      }
    });
    svg += '<text x="'+(gx+groupW/2)+'" y="'+(H-padB+16)+'" text-anchor="middle" font-size="11" fill="var(--ink-2)">'+esc(mt)+'</text>';
  });
  svg += '<line x1="'+padL+'" y1="'+(padT+plotH)+'" x2="'+(W-padR)+'" y2="'+(padT+plotH)+'" stroke="var(--axis)" stroke-width="1"/>';
  var legend = cb.map(function(b){return '<span><span class="dot" style="background:var('+b.colorVar+')"></span>'+esc(b.name)+'</span>';}).join("");
  return '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto;display:block" role="img">'+svg+'</svg><div class="legend">'+legend+'</div>';
}
function roundedTopRectPath(x,y,w,h,r){
  r = Math.min(r, w/2, h);
  if(h<=0) return '';
  if(h<r) r=h;
  return 'M'+x+','+(y+r)+' Q'+x+','+y+' '+(x+r)+','+y+' L'+(x+w-r)+','+y+' Q'+(x+w)+','+y+' '+(x+w)+','+(y+r)+' L'+(x+w)+','+(y+h)+' L'+x+','+(y+h)+' Z';
}

function wirePostScreenshots(){

async function handlePostScreenshotFiles(fileList){
  if(!caps.assets || !fileList || !fileList.length) return;

  for(var i=0;i<files.length;i++){
    try{
      var up = await caps.assets.upload(files[i]);
      pendingPostScreenshots.push({id:up.id, url:up.url});

function alertInline(nearEl, msg){

async function runEngagementAnalysis(){
  if(!caps.sample || runningCalls.engagement) return;
  var cb = coloredBrands();
  var byBrand = {};
  state.posts.forEach(function(p){ (byBrand[p.brandId]=byBrand[p.brandId]||[]).push(p); });
  var lines = [];
  cb.forEach(function(b){
    var list = (byBrand[b.id]||[]).slice().sort(function(a,c){return (c.postedAt||"").localeCompare(a.postedAt||"");}).slice(0,40);
    if(!list.length) return;
    lines.push("## "+b.name+(b.isTarget?" (TARGET)":"")+"");
    list.forEach(function(p){
      var eng=(Number(p.likes)||0)+(Number(p.comments)||0)+(Number(p.shares)||0);
      lines.push("- ["+p.platform+"/"+p.mediaType+(p.isPaidPartnership?"/PAID PARTNERSHIP":"")+"] eng="+eng+" views="+(p.views||0)+' caption="'+(p.caption||"").slice(0,150)+'" tags='+(p.hashtags||[]).join(" "));
    });
  });
  if(!lines.length){ return; }
  var prompt = "You are auditing competing brands' social media content. Below is logged post data per brand "+
    "(engagement = likes+comments+shares).\n\n"+lines.join("\n")+
    "\n\nWrite a concise analysis (plain text, no markdown headers, use short paragraphs and dashes for lists) covering: "+
    "1) which content characteristics (format, topic, tone, length, hook style) correlate with higher engagement, overall and per brand; "+
    "2) whether posts tagged PAID PARTNERSHIP perform differently from organic posts, where that comparison is possible; "+
    "3) what the target brand is doing well or missing versus competitors; "+
    "4) three concrete content recommendations for the target brand. Be specific, cite patterns from the captions, not generic advice. "+
    "Focus every recommendation on the B2B/business-buyer side of the brand (the people and teams evaluating or using the product at work), not individual consumers — only bring up a B2C angle if it directly helps B2B pipeline, engagement or perception.";
  var ctl = new AbortController(); runningCalls.engagement = ctl;
  renderRoute();
  try{
    var out = qs("#engagementOut");
    var res = await caps.sample(prompt, { modelTier:"default", signal: ctl.signal, onText: function(u){ if(out) out.textContent = u.text; } });
    await caps.db.collection("analysis").doc("engagement").set({ module:"engagement", resultText: res.text, generatedAt: nowIso() });
    await pushSnapshot("engagement", scoreEngagementPerBrand());
  }catch(e){
    if(e.code!=="cancelled"){ var out=qs("#engagementOut"); if(out) out.textContent = "Couldn't finish: "+e.code; }
  }finally{
    delete runningCalls.engagement; renderRoute();
  }
}
function scoreEngagementPerBrand(){
  var byBrand={};
  state.posts.forEach(function(p){
    var followers = followersFor(p.brandId, p.platform);
    if(!followers) return;
    var eng=(Number(p.likes)||0)+(Number(p.comments)||0)+(Number(p.shares)||0);
    byBrand[p.brandId]=byBrand[p.brandId]||{sum:0,count:0}; byBrand[p.brandId].sum+=eng/followers; byBrand[p.brandId].count++;
  });
  var out={};
  Object.keys(byBrand).forEach(function(id){ out[id] = byBrand[id].count ? byBrand[id].sum/byBrand[id].count : 0; });
  return out;
}

function termScoreBin(score){

  return Math.min(6, Math.floor(s/100*7))+1;

function measureTextWidth(text, font){

function buildTermsHeatmap(terms, cb){

  }).sort(function(a,c){ return c.total - a.total; });

  var labelFont = "11.5px " + getComputedStyle(document.body).fontFamily;
  var maxTermW = rows.reduce(function(m,r){ return Math.max(m, measureTextWidth(r.term, labelFont)); }, 0);
  var labelW = Math.max(100, Math.min(320, Math.ceil(maxTermW) + 24));
  var headerH = 40, rowH = 30, colW = 78, gap = 2, padR = 8, padB = 6;
  var plotW = cb.length*colW + (cb.length-1)*gap;
  var plotH = rows.length*rowH + (rows.length-1)*gap;
  var W = labelW + plotW + padR;
  var H = headerH + plotH + padB;

    svg += '<text x="'+cx+'" y="'+(headerH-22)+'" text-anchor="middle" font-size="12" font-weight="'+(b.isTarget?'700':'500')+'" fill="var(--ink)">'+esc(b.name)+(b.isTarget?' *':'')+'</text>';

  });
  rows.forEach(function(r, ri){
    var y = headerH + ri*(rowH+gap);
    svg += '<text x="'+(labelW-10)+'" y="'+(y+rowH/2+4)+'" text-anchor="end" font-size="11.5" fill="var(--ink-2)">'+esc(r.term)+'</text>';
    cb.forEach(function(b, bi){
      var x = labelW + bi*(colW+gap);
      var score = Number((r.scores||{})[b.name]) || 0;
      var bin = termScoreBin(score);
      svg += '<rect data-tip="'+esc(b.name)+' · “'+esc(r.term)+'”: '+Math.round(score)+'/100" x="'+(x+1)+'" y="'+(y+1)+'" width="'+(colW-2)+'" height="'+(rowH-2)+'" rx="4" fill="var(--seq-'+bin+')"></rect>'+
        '<text x="'+(x+colW/2)+'" y="'+(y+rowH/2+4)+'" text-anchor="middle" font-size="11.5" fill="var(--seq-'+bin+'-ink)" style="pointer-events:none">'+Math.round(score)+'</text>';
    });
  });
  var legendSteps = [1,2,3,4,5,6,7].map(function(i){ return '<span style="display:inline-block;width:18px;height:10px;background:var(--seq-'+i+')"></span>'; }).join("");
  var legend = '<div style="display:flex;align-items:center;gap:6px;margin-top:10px;font-size:11.5px;color:var(--ink-2)">'+
    '<span>Low</span><span style="display:flex;border-radius:3px;overflow:hidden">'+legendSteps+'</span><span>High</span>'+
    '<span class="muted" style="margin-left:10px">association strength, 0–100'+(cb.some(function(b){return b.isTarget;})?' · * target':'')+'</span>'+
  '</div>';

function buildSentimentBars(perBrand, cb){
  var W=680,H= Math.max(60, perBrand.length*48), rowH=40;
  var padL=120, padR=16;
  var plotW = W-padL-padR;
  var svg="";
  perBrand.forEach(function(pb,i){
    var y = i*rowH+6;
    var pos = Math.max(0,Number(pb.positivePct)||0), neu=Math.max(0,Number(pb.neutralPct)||0), neg=Math.max(0,Number(pb.negativePct)||0);
    var total = pos+neu+neg || 1;
    pos=pos/total*100; neu=neu/total*100; neg=neg/total*100;
    var x = padL;
    var segs = [["good",pos],["muted",neu],["critical",neg]];
    var gap=2;
    svg += '<text x="'+(padL-10)+'" y="'+(y+16)+'" text-anchor="end" font-size="12" fill="var(--ink-2)">'+esc(pb.brandName)+'</text>';
    segs.forEach(function(s,si){
      var w = (s[1]/100)*plotW - (si<2?gap:0);
      if(w<=0) return;
      var fill = s[0]==="good" ? "var(--good)" : s[0]==="critical" ? "var(--critical)" : "var(--border)";
      var r = (si===0 && si===segs.length-1) ? 5 : 0;
      var tl = si===0?5:0, bl=si===0?5:0, tr=0,br=0;
      var isLast = si===2 || (s[0]==="critical");
      svg += '<path data-tip="'+esc(pb.brandName)+' · '+s[0]+': '+s[1].toFixed(0)+'%" d="'+roundedSidePath(x,y,w,28,5, si===0, si===2)+'" fill="'+fill+'"></path>';
      if(s[1]>=8){
        svg += '<text x="'+(x+w/2)+'" y="'+(y+18)+'" text-anchor="middle" font-size="11" fill="#ffffff">'+s[1].toFixed(0)+'%</text>';
      }
      x += w+gap;
    });
  });
  var legend = '<span><span class="dot" style="background:var(--good)"></span>Positive</span><span><span class="dot" style="background:var(--border)"></span>Neutral</span><span><span class="dot" style="background:var(--critical)"></span>Negative</span>';
  return '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto;display:block" role="img">'+svg+'</svg><div class="legend">'+legend+'</div>';
}
function roundedSidePath(x,y,w,h,r,roundLeft,roundRight){
  if(w<=0) return '';
  var rl = roundLeft?Math.min(r,w/2):0, rr = roundRight?Math.min(r,w/2):0;
  return 'M'+(x+rl)+','+y+' L'+(x+w-rr)+','+y+' '+(rr?('Q'+(x+w)+','+y+' '+(x+w)+','+(y+rr)+' '):'')+
    'L'+(x+w)+','+(y+h-rr)+' '+(rr?('Q'+(x+w)+','+(y+h)+' '+(x+w-rr)+','+(y+h)+' '):'')+
    'L'+(x+rl)+','+(y+h)+' '+(rl?('Q'+x+','+(y+h)+' '+x+','+(y+h-rl)+' '):'')+
    'L'+x+','+(y+rl)+' '+(rl?('Q'+x+','+y+' '+(x+rl)+','+y+' '):'')+'Z';
}

async function collectValidImageBlobs(imgs, labelFn){
  var limits = await caps.sample.limits().catch(function(){ return null; });
  var okTypes = limits && limits.images ? limits.images.mediaTypes : ["image/jpeg","image/png","image/webp","image/gif"];
  var maxBytes = limits && limits.images ? limits.images.maxInputBytes : Infinity;
  var maxCount = limits && limits.images ? limits.images.maxCount : 6;
  var blobs = [], labels = [], skipped = 0;
  for(var i=0;i<imgs.length && blobs.length<maxCount;i++){
    try{
      var resp = await fetch("/_blob/"+imgs[i].assetId);
      var blob = await resp.blob();
      if(okTypes.indexOf(blob.type)===-1 || blob.size>maxBytes){ skipped++; continue; }
      blobs.push(blob);
      labels.push(labelFn(imgs[i], blobs.length));
    }catch(e){ skipped++; }
  }
  return { blobs: blobs, labels: labels, skipped: skipped };
}

function wireReviews(){

    var brandId = fd.get("brandId"); if(!brandId) return;
    var site = fd.get("site");
    var docId = reviewListingDocId(brandId, site);
    var prevId = editing.reviewListing ? reviewListingDocId(
      state.reviewListings.filter(function(l){return l.id===editing.reviewListing;})[0].brandId,
      state.reviewListings.filter(function(l){return l.id===editing.reviewListing;})[0].site
    ) : null;
    await caps.db.collection("reviewListings").doc(docId).set({
      brandId: brandId, site: site,
      rating: fd.get("rating")!=="" ? Number(fd.get("rating")) : null,
      reviewCount: Number(fd.get("reviewCount"))||0,
      category: fd.get("category")||"",
      positioning: fd.get("positioning")||"",
      idealFor: fd.get("idealFor")||"",
      themes: (fd.get("themes")||"").split(",").map(function(s){return s.trim();}).filter(Boolean),
      excerpts: fd.get("excerpts")||"",
      updatedAt: nowIso()
    });

  });

      var file = card.querySelector(".reviewShotFile").files[0];
      var site = card.querySelector(".reviewShotSite").value;

      btn.disabled = true;
      try{

        await caps.db.collection("reviewScreenshots").add({ brandId:brandId, site:site, assetId: up.id, createdAt: nowIso() });
      }catch(e){}
      btn.disabled = false;
    });
  });

    btn.addEventListener("click", function(){ runReviewVisualAnalysis(btn.getAttribute("data-brand")); });

async function runReviewThemesAnalysis(){

    lines.push("## "+b.name+(b.isTarget?" (TARGET)":""));
    listings.forEach(function(l){
      lines.push("["+l.site+"] positioning=\""+(l.positioning||"")+"\" idealFor=\""+(l.idealFor||"")+"\" themes="+(l.themes||[]).join(" ")+" excerpts=\""+(l.excerpts||"").slice(0,400)+"\"");
    });

  var brandNames = cb.map(function(b){return b.name;});
  var prompt = 'Below are review-site listing text (positioning tagline, ideal-customer description, recurring themes field, representative review excerpts) per brand: '+brandNames.join(", ")+'. Identify 8-16 recurring themes/phrases (not generic words \u2014 specific features, strengths or differentiation points customers call out) that distinguish these brands. '+
    'For each theme, score 0-100 how strongly EACH brand owns it in customer perception (0 = never comes up for that brand, 100 = that brand dominates it). '+
    'Reply with ONLY a JSON object: {"terms":[{"term":string,"scores":{'+brandNames.map(function(n){return JSON.stringify(n)+':number';}).join(",")+'}}],"summary":string}. '+
    'Use exactly these brand names as the keys of "scores" for every term, in every term object. summary is 2-3 sentences on the overall pattern (who owns what theme, and the clearest perception gap).\n\n'+lines.join("\n");
  runningCalls.reviewThemes = true; renderRoute();
  try{
    var data = await caps.sample.json(prompt, { modelTier:"default" });
    await caps.db.collection("analysis").doc("reviewThemes").set({ module:"reviewThemes", resultJson: data, generatedAt: nowIso() });
  }catch(e){}
  finally{ delete runningCalls.reviewThemes; renderRoute(); }

        '<button class="primary" id="runAppKeywords" '+(kwRunning?'disabled':'')+'>'+(kwRunning?'Thinking…':(kwAnalysis?'Re-run analysis':'Run analysis'))+'</button>'+
        (kwAnalysis ? '<span class="muted">Last run '+fmtDate(kwAnalysis.generatedAt)+'</span>' : '')+
      '</div>'+
      '<div style="margin-top:12px">'+kwBody+'</div>'+
    '</div>'+
    '<div class="card"><h2>Listing screenshots &amp; visual style</h2><div class="hint" style="margin-bottom:0">Upload the promo screenshots from each brand\'s store listing. Claude assesses color palette, how feature-callout text is used, and visual consistency with the brand\'s social presence.</div></div>'+
    visualSections+
  '</div>';
}
function wireAppStore(){
  var f = qs("#appListingForm");
  if(f) f.addEventListener("submit", async function(e){
    e.preventDefault();
    var fd = new FormData(f);
    var brandId = fd.get("brandId"); if(!brandId) return;
    var store = fd.get("store");
    var docId = appListingDocId(brandId, store);
    var prevId = editing.appListing ? appListingDocId(
      state.appListings.filter(function(l){return l.id===editing.appListing;})[0].brandId,
      state.appListings.filter(function(l){return l.id===editing.appListing;})[0].store
    ) : null;
    await caps.db.collection("appListings").doc(docId).set({
      brandId: brandId, store: store,
      rating: fd.get("rating")!=="" ? Number(fd.get("rating")) : null,
      ratingCount: Number(fd.get("ratingCount"))||0,
      downloads: Number(fd.get("downloads"))||0,
      category: fd.get("category")||"",
      title: fd.get("title")||"",
      subtitle: fd.get("subtitle")||"",
      keywords: (fd.get("keywords")||"").split(",").map(function(s){return s.trim();}).filter(Boolean),
      description: fd.get("description")||"",
      updatedAt: nowIso()
    });
    if(prevId && prevId!==docId){ await caps.db.collection("appListings").doc(prevId).delete(); }
    editing.appListing = null;
    f.reset();
  });
  qsa(".uploadAppShot").forEach(function(btn){
    btn.addEventListener("click", async function(){
      var brandId = btn.getAttribute("data-brand");
      var card = btn.closest(".card");
      var file = card.querySelector(".appShotFile").files[0];
      var store = card.querySelector(".appShotStore").value;
      if(!file || !caps.assets) return;
      btn.disabled = true;
      try{
        var up = await caps.assets.upload(file);
        await caps.db.collection("appScreenshots").add({ brandId:brandId, store:store, assetId: up.id, createdAt: nowIso() });
      }catch(e){}
      btn.disabled = false;
    });
  });
  qsa(".runAppVisual").forEach(function(btn){
    btn.addEventListener("click", function(){ runAppVisualAnalysis(btn.getAttribute("data-brand")); });
  });
  var run = qs("#runAppKeywords");
  if(run) run.addEventListener("click", runAppKeywordsAnalysis);
}
async function runAppKeywordsAnalysis(){
  if(!caps.sample || runningCalls.appKeywords) return;
  var cb = coloredBrands();
  var lines = [];
  cb.forEach(function(b){
    var listings = state.appListings.filter(function(l){return l.brandId===b.id;});
    if(!listings.length) return;
    lines.push("## "+b.name+(b.isTarget?" (TARGET)":""));
    listings.forEach(function(l){
      lines.push("["+l.store+"] title=\""+(l.title||"")+"\" subtitle=\""+(l.subtitle||"")+"\" keywords="+(l.keywords||[]).join(" ")+" description=\""+(l.description||"").slice(0,400)+"\"");
    });
  });
  if(!lines.length) return;
  var brandNames = cb.map(function(b){return b.name;});
  var prompt = 'Below are App Store/Google Play listing text (title, subtitle, keywords field, description) per brand: '+brandNames.join(", ")+'. Identify 8-16 recurring ASO terms/phrases (not generic words — specific features, benefits or value props a buyer would search for) that distinguish these listings. '+
    'For each term, score 0-100 how strongly EACH brand\'s listing is optimized around it (0 = never appears for that brand, 100 = that brand\'s listing is built around it). '+
    'Reply with ONLY a JSON object: {"terms":[{"term":string,"scores":{'+brandNames.map(function(n){return JSON.stringify(n)+':number';}).join(",")+'}}],"summary":string}. '+
    'Use exactly these brand names as the keys of "scores" for every term, in every term object. summary is 2-3 sentences on the overall pattern (who owns what ASO term, and the clearest keyword gap).\n\n'+lines.join("\n");
  runningCalls.appKeywords = true; renderRoute();
  try{
    var data = await caps.sample.json(prompt, { modelTier:"default" });
    await caps.db.collection("analysis").doc("appKeywords").set({ module:"appKeywords", resultJson: data, generatedAt: nowIso() });
  }catch(e){}
  finally{ delete runningCalls.appKeywords; renderRoute(); }
}
async function runAppVisualAnalysis(brandId){
  if(!caps.sample) return;
  var key = "appVisual_"+brandId;
  if(runningCalls[key]) return;
  var imgs = brandAppScreenshots(brandId).slice(0,6);
  if(!imgs.length) return;
  delete imageAnalysisErrors[key];
  runningCalls[key] = true; renderRoute();
  try{
    var r = await collectValidImageBlobs(imgs, function(img, n){ return "Image "+n+": "+img.store+" listing screenshot"; });
    if(!r.blobs.length) throw {code: r.skipped ? "image_rejected" : "no_images"};
    var prompt = "These are real promo screenshots from one brand's App Store / Google Play listing, in this order:\n"+r.labels.join("\n")+
      "\n\nAssess visual/creative style in plain text (short paragraphs, no markdown headers): "+
      "dominant color palette, how feature-callout text/captions are used on the screenshots, subject focus (product UI vs. lifestyle imagery), and how visually consistent the listing is. End with one suggestion aimed at the B2B/business-buyer audience, not individual consumers.";
    var res = await caps.sample(prompt, { modelTier:"default", images: r.blobs });
    await caps.db.collection("analysis").doc(key).set({ module:key, resultText: res.text, generatedAt: nowIso(), skippedCount: r.skipped });
  }catch(e){ imageAnalysisErrors[key] = (e && e.code) || "unknown_error"; }
  finally{ delete runningCalls[key]; renderRoute(); }
}

function renderSynthesis(){
  var cb = coloredBrands();
  if(cb.length===0) return '<div class="empty">Add brands in Setup first.</div>';
  var analysis = state.analysis.synthesis;
  var running = !!runningCalls.synthesis;
  var haveAny = state.analysis.engagement || state.analysis.terms || state.analysis.sentiment || state.analysis.ads || state.analysis.appKeywords || state.analysis.reviewThemes;
  return '<div class="panel">'+
    '<div class="card">'+
      '<h2>Executive synthesis</h2>'+
      '<div class="hint">Rolls up every module that has been run into one "who is winning where, and what to do about it" brief for the target brand.</div>'+
      '<div class="toolbar">'+
        '<button class="primary" id="runSynthesis" '+((running||!haveAny)?'disabled':'')+'>'+(running?'Thinking…':(analysis?'Re-run synthesis':'Generate synthesis'))+'</button>'+
        (analysis ? '<span class="muted">Last run '+fmtDate(analysis.generatedAt)+'</span>' : '')+
      '</div>'+
      (haveAny ? '' : '<div class="muted" style="margin-top:10px;font-size:12.5px">Run at least one of Engagement, Terms, Sentiment, Ads, Review Themes or App Store Keywords first.</div>')+
      '<div class="analysis-out" id="synthesisOut" style="margin-top:14px">'+(analysis ? esc(analysis.resultText) : '')+'</div>'+
    '</div>'+
  '</div>';
}
function wireSynthesis(){
  var run = qs("#runSynthesis");
  if(run) run.addEventListener("click", runSynthesis);
}
async function runSynthesis(){
  if(!caps.sample || runningCalls.synthesis) return;
  var cb = coloredBrands();
  var parts = [];
  parts.push("Brands in this audit: "+cb.map(function(b){return b.name+(b.isTarget?" (TARGET)":" (competitor)");}).join(", ")+".");
  if(state.presence.length){
    parts.push("\nPresence: "+state.presence.map(function(p){return brandName(p.brandId)+" on "+p.platform+": "+fmtNum(p.followers)+" followers, cadence "+p.cadence;}).join("; "));
  }
  if(state.analysis.engagement) parts.push("\nENGAGEMENT ANALYSIS:\n"+state.analysis.engagement.resultText);
  if(state.analysis.terms && state.analysis.terms.resultJson) parts.push("\nTERMS OWNERSHIP:\n"+JSON.stringify(state.analysis.terms.resultJson));
  if(state.analysis.sentiment && state.analysis.sentiment.resultJson) parts.push("\nSENTIMENT:\n"+JSON.stringify(state.analysis.sentiment.resultJson));
  if(state.analysis.ads) parts.push("\nPAID ADS ANALYSIS:\n"+state.analysis.ads.resultText);
  cb.forEach(function(b){ var v = state.analysis["visual_"+b.id]; if(v) parts.push("\nVISUAL STYLE ("+b.name+"):\n"+v.resultText); });
  if(state.reviewListings.length){
    parts.push("\nReview site ratings: "+state.reviewListings.map(function(l){return brandName(l.brandId)+" on "+l.site+": "+(l.rating!=null?l.rating:"?")+"\u2605 ("+fmtNum(l.reviewCount)+" reviews)";}).join("; "));
  }
  if(state.analysis.reviewThemes && state.analysis.reviewThemes.resultJson) parts.push("\nREVIEW SITE THEME OWNERSHIP:\n"+JSON.stringify(state.analysis.reviewThemes.resultJson));
  cb.forEach(function(b){ var v = state.analysis["reviewVisual_"+b.id]; if(v) parts.push("\nREVIEW SITE VISUAL STYLE ("+b.name+"):\n"+v.resultText); });
  if(state.appListings.length){
    parts.push("\nApp store ratings: "+state.appListings.map(function(l){return brandName(l.brandId)+" on "+l.store+": "+(l.rating!=null?l.rating:"?")+"★ ("+fmtNum(l.ratingCount)+" reviews"+(l.downloads?", "+fmtNum(l.downloads)+"+ downloads":"")+")";}).join("; "));
  }
  if(state.analysis.appKeywords && state.analysis.appKeywords.resultJson) parts.push("\nAPP STORE KEYWORD OWNERSHIP:\n"+JSON.stringify(state.analysis.appKeywords.resultJson));
  cb.forEach(function(b){ var v = state.analysis["appVisual_"+b.id]; if(v) parts.push("\nAPP STORE LISTING VISUAL STYLE ("+b.name+"):\n"+v.resultText); });
  var prompt = "You are writing an executive brief for the TARGET brand's marketing team from a competitive social media audit. "+
    "Using the module analyses below, write a plain-text brief (short paragraphs, dashes for lists, no markdown headers) with three sections: "+
    "WHERE WE'RE WINNING, WHERE WE'RE LOSING, and WHAT TO DO NEXT (3-5 concrete, prioritized actions). Be specific and reference the actual brands by name. "+
    "The target brand serves business buyers (B2B) — keep every section and every action item focused on the B2B/business side (pipeline, demos, decision-makers, procurement); only mention a B2C angle if it directly helps B2B growth, engagement or perception, and say explicitly how.\n"+parts.join("\n");
  runningCalls.synthesis = true; renderRoute();
  try{
    var out = qs("#synthesisOut");
    var res = await caps.sample(prompt, { modelTier:"default", effort:"high", onText:function(u){ if(out) out.textContent=u.text; } });
    await caps.db.collection("analysis").doc("synthesis").set({ module:"synthesis", resultText: res.text, generatedAt: nowIso() });
  }catch(e){}
  finally{ delete runningCalls.synthesis; renderRoute(); }
}

async function pushSnapshot(module, perBrandScores){
  if(!caps.db) return;
  await caps.db.collection("snapshots").add({ module: module, perBrand: perBrandScores, createdAt: nowIso() });
}
function renderTrends(){
  var cb = coloredBrands();
  if(cb.length===0) return '<div class="empty">Add brands in Setup first.</div>';
  var modules = ["sentiment","engagement"];
  var sections = modules.map(function(m){
    var snaps = state.snapshots.filter(function(s){return s.module===m;}).sort(function(a,b){return (a.createdAt||"").localeCompare(b.createdAt||"");});
    if(snaps.length<1) return '<div class="card"><h2>'+(m==="sentiment"?"Sentiment":"Engagement")+' over time</h2><div class="empty">Run the '+m+' analysis at least once (twice to see a trend) to populate this.</div></div>';
    var chart = buildLineChart(snaps, cb, m==="sentiment" ? "net sentiment score" : "avg engagement rate", m==="engagement");
    return '<div class="card"><h2>'+(m==="sentiment"?"Sentiment":"Engagement rate")+' over time</h2><div class="hint">Each point is captured automatically whenever you re-run that module\'s analysis.</div>'+chart+'</div>';
  }).join("");
  return '<div class="panel">'+sections+'</div>';
}
function buildLineChart(snaps, cb, yLabel, isPct){
  var W=680,H=280,padL=48,padR=16,padT=16,padB=30;
  var plotW=W-padL-padR, plotH=H-padT-padB;
  var allVals = [];
  snaps.forEach(function(s){ cb.forEach(function(b){ if(s.perBrand && s.perBrand[b.id]!=null) allVals.push(s.perBrand[b.id]); }); });
  var floor = isPct ? 0.01 : 1;
  var minV = Math.min(0, allVals.length?Math.min.apply(null,allVals):0);
  var maxV = Math.max(floor, allVals.length?Math.max.apply(null,allVals):floor);
  if(maxV===minV) maxV=minV+floor;
  function xAt(i){ return padL + (snaps.length<=1?0:(plotW*i/(snaps.length-1))); }
  function yAt(v){ return padT + plotH - ((v-minV)/(maxV-minV))*plotH; }
  var svg = "";
  var ticks=4;
  for(var t=0;t<=ticks;t++){
    var val = minV + (maxV-minV)*t/ticks;
    var yy = yAt(val);
    svg += '<line x1="'+padL+'" y1="'+yy+'" x2="'+(W-padR)+'" y2="'+yy+'" stroke="var(--grid)" stroke-width="1"/>';
    svg += '<text x="'+(padL-8)+'" y="'+(yy+4)+'" text-anchor="end" font-size="10" fill="var(--muted)">'+(isPct?fmtPct(val):val.toFixed(0))+'</text>';
  }
  cb.forEach(function(b){
    var pts = snaps.map(function(s,i){ var v = s.perBrand ? s.perBrand[b.id] : null; return v==null ? null : [xAt(i), yAt(v)]; }).filter(Boolean);
    if(pts.length<1) return;
    var d = pts.map(function(p,i){return (i===0?"M":"L")+p[0]+","+p[1];}).join(" ");
    svg += '<path d="'+d+'" fill="none" stroke="var('+b.colorVar+')" stroke-width="2"></path>';
    var vals = snaps.map(function(s){ return s.perBrand ? s.perBrand[b.id] : null; }).filter(function(v){return v!=null;});
    pts.forEach(function(p,pi){ var v=vals[pi]; svg += '<circle cx="'+p[0]+'" cy="'+p[1]+'" r="4" fill="var('+b.colorVar+')" data-tip="'+esc(b.name)+' · '+yLabel+': '+(isPct?fmtPct(v):v.toFixed(1))+'"></circle>'; });
  });
  svg += '<line x1="'+padL+'" y1="'+(padT+plotH)+'" x2="'+(W-padR)+'" y2="'+(padT+plotH)+'" stroke="var(--axis)" stroke-width="1"/>';
  var legend = cb.map(function(b){return '<span><span class="dot" style="background:var('+b.colorVar+')"></span>'+esc(b.name)+'</span>';}).join("");
  return '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto;display:block" role="img">'+svg+'</svg><div class="legend">'+legend+'</div>';
}

/* ---------- generic row deletes (delegated) ---------- */
document.addEventListener("click", async function(e){
  var el = e.target.closest("[data-act]");
  if(!el) return;
  var act = el.getAttribute("data-act"), id = el.getAttribute("data-id");
  // UI-only state toggles (no db call needed)
  if(act==="edit-presence"){ editing.presence = id; renderRoute(); return; }
  if(act==="cancel-presence-edit"){ editing.presence = null; renderRoute(); return; }
  if(act==="edit-post"){ editing.post = id; pendingPostScreenshots = null; renderRoute(); return; }
  if(act==="cancel-post-edit"){ editing.post = null; pendingPostScreenshots = null; renderRoute(); return; }
  if(act==="edit-ad"){ editing.ad = id; renderRoute(); return; }
  if(act==="cancel-ad-edit"){ editing.ad = null; renderRoute(); return; }
  if(act==="edit-comment"){ editing.comment = id; renderRoute(); return; }
  if(act==="cancel-comment-edit"){ editing.comment = null; renderRoute(); return; }
  if(act==="edit-reviewlisting"){ editing.reviewListing = id; renderRoute(); return; }
  if(act==="cancel-reviewlisting-edit"){ editing.reviewListing = null; renderRoute(); return; }
  if(act==="edit-applisting"){ editing.appListing = id; renderRoute(); return; }
  if(act==="cancel-applisting-edit"){ editing.appListing = null; renderRoute(); return; }

  if(!caps.db) return;
  if(act==="del-brand"){ await caps.db.collection("brands").doc(id).delete(); }
  else if(act==="set-target"){
    await Promise.all(state.brands.filter(function(b){return b.isTarget;}).map(function(b){return caps.db.collection("brands").doc(b.id).update({isTarget:false});}));
    await caps.db.collection("brands").doc(id).update({isTarget:true});
  }
  else if(act==="del-presence"){ await caps.db.collection("presence").doc(id).delete(); }
  else if(act==="del-post"){ await caps.db.collection("posts").doc(id).delete(); }
  else if(act==="del-comment"){ await caps.db.collection("postComments").doc(id).delete(); }
  else if(act==="del-ad"){ await caps.db.collection("ads").doc(id).delete(); }
  else if(act==="del-reviewlisting"){ await caps.db.collection("reviewListings").doc(id).delete(); }
  else if(act==="del-reviewshot"){ await caps.db.collection("reviewScreenshots").doc(id).delete(); }
  else if(act==="del-applisting"){ await caps.db.collection("appListings").doc(id).delete(); }
  else if(act==="del-appshot"){ await caps.db.collection("appScreenshots").doc(id).delete(); }
  else if(act==="save-comment"){
    var input = qs("#editCommentInput");
    var newText = input ? input.value.trim() : "";
    if(newText){ await caps.db.collection("postComments").doc(id).update({text:newText}); }
    editing.comment = null;
    renderRoute();
  }
});
